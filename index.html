let combo=0,comboUntil=0,overdriveUntil=0,seenKills=0,lastHp=p.hp,shake=0;const status=document.createElement('div');status.style.cssText='position:fixed;right:24px;bottom:26px;text-align:right;color:#c5ff63;font:11px DM Mono;letter-spacing:.08em;text-shadow:0 0 12px #c5ff6388;pointer-events:none';document.body.append(status);const baseFire=fire;fire=function(){let boosted=performance.now()<overdriveUntil,damage=p.damage;if(boosted)p.damage*=1.45;baseFire();p.damage=damage};const baseUpdate=update;update=function(dt){baseUpdate(dt);p.angle=Math.atan2(mouse.y-p.y,mouse.x-p.x);let now=performance.now();if(kills>seenKills){let gained=kills-seenKills;seenKills=kills;combo+=gained;comboUntil=now+2600;shake=Math.min(11,shake+gained*2);if(combo>0&&combo%8===0){p.hp=Math.min(p.max,p.hp+12);burst(p.x,p.y,'#c5ff63',22);note('COMBO HEAL +12')}if(combo>=15&&now>overdriveUntil){overdriveUntil=now+5000;combo=0;note('OVERDRIVE // 45% DAMAGE');sound('gun')}}if(now>comboUntil)combo=0;if(p.hp<lastHp){shake=9;burst(p.x,p.y,'#ff5b75',10)}lastHp=p.hp;let dashReady=Math.max(0,850-(now-dashAt));status.innerHTML=(now<overdriveUntil?'OVERDRIVE '+Math.ceil((overdriveUntil-now)/1000)+'s<br>':'')+(combo?'COMBO ×'+combo+'<br>':'')+(dashReady?'DASH '+(dashReady/1000).toFixed(1)+'s':'DASH READY')};const baseDraw=draw;draw=function(){x.save();if(shake>0){x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.79}baseDraw();if(performance.now()<overdriveUntil){x.strokeStyle='#c5ff63';x.lineWidth=2;x.shadowColor='#c5ff63';x.shadowBlur=20;x.beginPath();x.arc(p.x,p.y,p.r+9+Math.sin(performance.now()/90)*3,0,7);x.stroke()}x.restore()};function laserOverlay(){if(laserBeam&&performance.now()<laserBeam.until){x.save();x.strokeStyle='#ff3030';x.shadowColor='#ff3030';x.shadowBlur=22;for(let a of laserBeam.beams){x.lineWidth=5;x.beginPath();x.moveTo(p.x,p.y);x.lineTo(p.x+Math.cos(a)*5000,p.y+Math.sin(a)*5000);x.stroke();x.strokeStyle='#fff';x.lineWidth=1.5;x.stroke();x.strokeStyle='#ff3030'}x. let fires=[];const rocketDraw=draw;draw=function(){rocketDraw();for(let f of fires){f.life--;let fade=Math.max(0,f.life/f.max),r=30+Math.sin(f.life*.3)*4;x.save();x.globalAlpha=fade*.82;let g=x.createRadialGradient(f.x,f.y,1,f.x,f.y,r);g.addColorStop(0,'#fff4a4');g.addColorStop(.25,'#ff9d32');g.addColorStop(.65,'#e53a1d');g.addColorStop(1,'#e53a1d00');x.fillStyle=g;x.shadowColor='#ff5a25';x.shadowBlur=20;x.beginPath();x.arc(f.x,f.y,r,0,7);x.fill();x.restore()}fires=fires.filter(f=>f.life>0);for(let b of bullets)if(b.type==='rocket'){let a=Math.atan2(b.vy,b.vx);x.save();x.translate(b.x,b.y);x.rotate(a);x.fillStyle='#ff9d57';x.shadowColor='#ff6b2d';x.shadowBlur=16;x.fillRect(-9,-4,18,8);x.fillStyle='#fff0bf';x.fillRect(4,-2,6,4);x.fillStyle='#ff4d2e';x.fillRect(-14,-3,6,6);x.restore()}};
let gameOver=false;const death=document.createElement('section');death.style.cssText='position:fixed;inset:0;display:none;place-items:center;background:#050914d9;backdrop-filter:blur(8px);z-index:5';death.innerHTML='<div style="text-align:center;padding:32px;border:1px solid #ff5b7588;border-radius:22px;background:#111c31;box-shadow:0 25px 90px #000"><h2 style="margin:0;color:#ff5b75;letter-spacing:.13em">YOU WERE OVERRUN</h2><p id="deathStats" style="color:#c6d3ea;font:12px DM Mono;line-height:1.7"></p><button id="restart" class="choice" style="min-width:180px">RESTART RUN<small>Press R anytime</small></button></div>';document.body.append(death);function die(){gameOver=true;paused=true;between=true;death.querySelector('#deathStats').innerHTML='REACHED WAVE '+wave+'<br>'+kills+' ZOMBIES ELIMINATED';death.style.display='grid';sound('hurt')}death.querySelector('#restart').onclick=()=>location.reload();addEventListener('keydown',e=>{if(gameOver&&e.key.toLowerCase()==='r')location.reload()});const combatUpdate=update;update=function(dt){combatUpdate(dt);if(p.hp<=0&&!gameOver)die()};
const fireUpdate=update;update=function(dt){fireUpdate(dt);if(!paused)for(let f of fires)for(let z of zombies)if(!z.dead&&Math.hypot(z.x-f.x,z.y-f.y)<34){z.hp-=.38*dt;z.hit=5;if(z.hp<=0){z.dead=true;kills++;burst(z.x,z.y,'#ff6a32',8)}}};
function nearestZombie(px,py){let best=null,bestD=Infinity;for(let z of zombies)if(!z.dead){let d=Math.hypot(z.x-px,z.y-py);if(d<bestD){best=z;bestD=d}}return best}const guidedFire=fire;fire=function(){let start=bullets.length;guidedFire();if(p.weapon==='rocket'&&p.missilePod&&bullets.length>start){let target=nearestZombie(p.x,p.y);for(let i=start;i<bullets.length;i++){bullets[i].homing=true;bullets[i].target=target}if(target)note('HOMING ROCKET')}};const homingUpdate=update;update=function(dt){if(!paused)for(let b of bullets)if(b.homing){if(!b.target||b.target.dead)b.target=nearestZombie(b.x,b.y);if(b.target){let speed=Math.hypot(b.vx,b.vy),a=Math.atan2(b.target.y-b.y,b.target.x-b.x);b.vx+=(Math.cos(a)*speed-b.vx)*.16;b.vy+=(Math.sin(a)*speed-b.vy)*.16}}homingUpdate(dt)};const podDraft=applyDraft;applyDraft=function(u){if(u==='unlockMissile'){p.missilePod=true;note('MISSILE POD // ROCKETS HOME');showUpgrades();choose();return}podDraft(u)};
let heals=[],nextHeal=performance.now()+4500;const pickupUpdate=update;update=function(dt){let now=performance.now();if(!paused&&now>nextHeal){heals.push({x:55+Math.random()*(W-110),y:115+Math.random()*(H-180),life:900});nextHeal=now+5500+Math.random()*6500}for(let h of heals){h.life-=dt;if(!paused&&Math.hypot(p.x-h.x,p.y-h.y)<p.r+18){h.life=0;p.hp=Math.min(p.max,p.hp+32);note('HEALTH PACK +32 HP');sound('gun')}}heals=heals.filter(h=>h.life>0);pickupUpdate(dt)};const pickupDraw=draw;draw=function(){pickupDraw();for(let h of heals){let pulse=1+Math.sin(performance.now()/140+h.x)*.12;x.save();x.translate(h.x,h.y);x.scale(pulse,pulse);x.fillStyle='#c5ff63';x.shadowColor='#c5ff63';x.shadowBlur=18;x.beginPath();x.arc(0,0,14,0,7);x.fill();x.fillStyle='#102012';x.fillRect(-3,-9,6,18);x.fillRect(-9,-3,18,6);x.restore()}};const helpEl=document.querySelector('.help');helpEl.innerHTML='<b>WASD / ARROWS</b> move &nbsp; <b>MOUSE</b> aim &nbsp; <b>1–3</b> weapons &nbsp; <b>SPACE</b> dash &nbsp; <b>GREEN +</b> health pack';
const longHomingFire=fire;fire=function(){let start=bullets.length;longHomingFire();for(let i=start;i<bullets.length;i++)if(bullets[i].homing)bullets[i].life=180};
let bossWave=0;const spawnWithBoss=zombie;zombie=function(){spawnWithBoss();let z=zombies[zombies.length-1];if(z&&wave>=5&&wave%5===0&&bossWave!==wave){bossWave=wave;z.boss=true;z.kind='overlord';z.r=42;z.hp=(35+wave*7)*8;z.speed=.34+wave*.035;z.color='#8c5cff';z.attack=-10;note('OVERLORD INBOUND // WAVE '+wave)}};const critFire=fire;fire=function(){let start=bullets.length;critFire();for(let i=start;i<bullets.length;i++){let b=bullets[i];if(b.type==='blaster'&&Math.random()<.14){b.damage*=2.25;b.crit=true}}};const polishDraw=draw;draw=function(){polishDraw();x.save();x.translate(mouse.x,mouse.y);x.strokeStyle='#dceaff';x.lineWidth=1.4;x.shadowColor='#55e6ff';x.shadowBlur=10;x.beginPath();x.arc(0,0,10,0,7);x.moveTo(-16,0);x.lineTo(-6,0);x.moveTo(6,0);x.lineTo(16,0);x.moveTo(0,-16);x.lineTo(0,-6);x.moveTo(0,6);x.lineTo(0,16);x.stroke();x.restore();let boss=zombies.find(z=>z.boss&&!z.dead);if(boss){let bw=Math.min(440,W-80),bx=(W-bw)/2;x.save();x.fillStyle='#080d1bdd';x.fillRect(bx,72,bw,20);x.fillStyle='#8c5cff';x.shadowColor='#8c5cff';x.shadowBlur=14;x.fillRect(bx+3,75,(bw-6)*Math.max(0,boss.hp/((35+wave*7)*8)),14);x.fillStyle='#f3edff';x.font='700 11px DM Mono';x.textAlign='center';x.fillText('OVERLORD',W/2,67);x.restore()}};
const zombieCharacterDraw=draw;draw=function(){zombieCharacterDraw();for(let z of zombies){let s=z.r/22,skin=z.hit?'#ff4050':z.color;x.save();x.translate(z.x,z.y);x.scale(s,s);x.shadowColor=skin;x.shadowBlur=8;x.fillStyle='#162019';x.fillRect(-11,2,22,24);x.fillStyle=skin;x.fillRect(-9,0,18,23);x.fillStyle='#102015';x.fillRect(-14,6,5,16);x.fillRect(9,6,5,16);x.fillStyle=skin;x.beginPath();x.arc(0,-10,11,0,7);x.fill();x.fillStyle='#1a271c';x.fillRect(-10,-18,20,6);x.fillStyle=z.boss?'#f3edff':'#ffef8c';x.shadowColor=x.fillStyle;x.shadowBlur=10;x.fillRect(-6,-12,4,3);x.fillRect(3,-12,4,3);x.fillStyle='#0a100c';x.fillRect(-5,-4,10,3);x.fillStyle='#101812';x.fillRect(-8,23,6,8);x.fillRect(2,23,6,8);if(z.boss){x.strokeStyle='#d7c2ff';x.lineWidth=2;x.beginPath();x.arc(0,1,28,0,7);x.stroke()}x.restore()}};
